name: Generate Weekly Trivia Game

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
  repository_dispatch:
    types: [generate-game]

jobs:
  generate-game:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync with remote
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git fetch origin main
          git reset --hard origin/main

      - name: Generate and publish game
        run: npm run generate:publish
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NODE_ENV: production

      - name: Commit and push changes
        run: |
          git add data/games/*.json data/games/index.json data/question-ledger.json data/used-questions.json data/banned-questions.json public/data/games/
          if ! git diff --staged --quiet; then
            git commit -m "Generate weekly trivia game for $(date +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || sleep 2
            done
          else
            echo "No changes to commit"
          fi
